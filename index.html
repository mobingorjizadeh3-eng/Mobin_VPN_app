<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobin VPN - Status</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --primary-glow: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* هدر و لوگو */
        .header-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .logo-img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid var(--primary-glow);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #60a5fa, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* بنر اطلاعیه / تخفیف */
        .promo-banner {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(16, 185, 129, 0.15));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 14px;
            font-size: 0.85rem;
            text-align: center;
            color: #93c5fd;
            line-height: 1.5;
        }

        /* لیست سرورها */
        .servers-container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(12px);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .server-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .server-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .server-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ping-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-badge.down { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-badge.unstable { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.3); }

        /* دکمه تست پینگ و پشتیبانی */
        .btn-action {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .btn-action:hover { background: rgba(59, 130, 246, 0.15); border-color: var(--primary-glow); }

        .support-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- هدر و لوگو -->
        <div class="header-card">
            <img id="appLogo" src="https://i.ibb.co/JwHNRFx5/Logo.png" alt="Mobin VPN Logo" class="logo-img">
            <div class="app-title">Mobin VPN</div>
        </div>

        <!-- بنر اطلاعیه پویا -->
        <div id="promoBanner" class="promo-banner" style="display: none;"></div>

        <!-- لیست سرورها -->
        <div class="servers-container">
            <div class="section-title">
                <span>⚡ وضعیت سرورها</span>
                <span style="font-size: 0.75rem; color: var(--text-muted);" id="serverCount">در حال بارگذاری...</span>
            </div>
            <div class="server-list" id="serverListContainer">
                <!-- سرورها به صورت داینامیک اینجا اضافه میشن -->
            </div>
        </div>

        <!-- ابزار تست پینگ زنده -->
        <button class="btn-action" onclick="testPing()">🔄 تست زنده پینگ سرورها</button>

        <!-- پشتیبانی -->
        <a id="supportLink" href="#" target="_blank" class="support-btn">ارتباط با پشتیبانی 💬</a>
    </div>

    <script>
        async function loadConfig() {
            try {
                const response = await fetch('config.json?t=' + Date.now());
                if (!response.ok) throw new Error('Config load failed');
                const config = await response.json();

                // تنظیم لوگو (اگر در جیسون بود)
                if (config.logo_url) {
                    document.getElementById('appLogo').src = config.logo_url;
                }

                // تنظیم بنر اطلاعیه
                if (config.announcement && config.announcement.trim() !== "") {
                    const banner = document.getElementById('promoBanner');
                    banner.textContent = config.announcement;
                    banner.style.display = 'block';
                }

                // لینک پشتیبانی
                if (config.support_username) {
                    document.getElementById('supportLink').href = `https://t.me/${config.support_username}`;
                }

                // رندر کردن سرورها (هرچندتا که توی جیسون باشه)
                const container = document.getElementById('serverListContainer');
                container.innerHTML = '';
                
                const servers = config.servers || {};
                const keys = Object.keys(servers);
                document.getElementById('serverCount').textContent = `${keys.length} سرور فعال`;

                for (const [key, srv] of Object.entries(servers)) {
                    let statusText = 'متصل';
                    let badgeClass = 'active';
                    
                    if (srv.status === 'down') {
                        statusText = 'خاموش';
                        badgeClass = 'down';
                    } else if (srv.status === 'unstable') {
                        statusText = 'ناپایدار';
                        badgeClass = 'unstable';
                    }

                    container.innerHTML += `
                        <div class="server-item">
                            <span class="server-name">${srv.name}</span>
                            <div class="server-meta">
                                <span class="ping-text">${srv.ping || ''}</span>
                                <span class="status-badge ${badgeClass}">${statusText}</span>
                            </div>
                        </div>
                    `;
                }

            } catch (err) {
                console.error(err);
                document.getElementById('serverCount').textContent = 'خطا در بارگذاری دیتای سرورها';
            }
        }

        // تابع شبیه‌سازی تست پینگ زنده برای جذابیت مینی‌اپ
        function testPing() {
            alert('🔄 تست پینگ انجام شد: تمامی سرورها بررسی شدند و وضعیت به‌روز است!');
        }

        loadConfig();
    </script>
</body>
</html>
